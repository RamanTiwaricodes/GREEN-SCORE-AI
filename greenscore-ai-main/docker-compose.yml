version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenscore-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
    volumes:
      - ./backend/greenscore.db:/app/greenscore.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenscore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
